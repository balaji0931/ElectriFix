services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-electrifix}
      POSTGRES_USER: ${POSTGRES_USER:-electrifix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-electrifix}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-electrifix}:${POSTGRES_PASSWORD:-electrifix}@db:5432/${POSTGRES_DB:-electrifix}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-electrifix}:${POSTGRES_PASSWORD:-electrifix}@db:5432/${POSTGRES_DB:-electrifix}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AI_SUMMARIES_ENABLED: ${AI_SUMMARIES_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      AI_SUMMARY_TIMEOUT_MS: ${AI_SUMMARY_TIMEOUT_MS:-5000}
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
    depends_on:
      server:
        condition: service_started

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      client:
        condition: service_started
      server:
        condition: service_started

volumes:
  postgres-data:
